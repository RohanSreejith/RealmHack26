# Render Blueprint Specification for Hack-Eye
# Target: Best Use of Render Prize
# Architecture: Edge-First Industrial Safety Intelligence + Render Cloud Asynchronous Incident Workflows

services:
  # 1. Hack-Eye Central Cloud API & Operations Dashboard Web Service
  - type: web
    name: hackeye-cloud-platform
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m hackeye.backend.main"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: hackeye-postgres
          property: connectionString
      - key: ADAPTION_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: RENDER_SERVICE_TYPE
        value: "WEB_API"

databases:
  # 2. Render Managed PostgreSQL Database (Free Tier)
  - name: hackeye-postgres
    region: oregon
    plan: free
    databaseName: hackeye
    user: hackeye_admin
