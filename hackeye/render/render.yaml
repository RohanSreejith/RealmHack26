# Render Blueprint Specification for Hack-Eye
# Deploys FastAPI Backend Service + Managed PostgreSQL Database + Workflow Worker

services:
  # 1. Hack-Eye Central Cloud API & Web Dashboard Service
  - type: web
    name: hackeye-cloud-platform
    env: python
    region: oregon
    plan: standard
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn hackeye.backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: hackeye-postgres
          property: connectionString
      - key: ADAPTION_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false

  # 2. Render Incident Background Worker (Async Workflows)
  - type: worker
    name: hackeye-workflow-worker
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m hackeye.render.workflow_engine"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hackeye-postgres
          property: connectionString

databases:
  # 3. Render Managed PostgreSQL Database
  - name: hackeye-postgres
    region: oregon
    plan: starter
    databaseName: hackeye
    user: hackeye_admin
